# The "hello world" of Spark on Kubernetes: compute Pi.
# This is a SparkApplication custom resource. The Spark Operator's
# controller watches for objects of this Kind and turns them into a
# `spark-submit` invocation under the hood (see docs/05-running-spark-jobs.md
# for exactly what that spark-submit command looks like).
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: spark-pi
  namespace: spark-jobs
spec:
  type: Scala
  mode: cluster
  image: "docker.io/apache/spark:3.5.1"
  imagePullPolicy: IfNotPresent
  mainClass: org.apache.spark.examples.SparkPi
  mainApplicationFile: "local:///opt/spark/examples/jars/spark-examples_2.12-3.5.1.jar"
  arguments:
    - "1000"   # number of Monte Carlo slices -> more slices = longer runtime
  sparkVersion: "3.5.1"
  restartPolicy:
    type: Never
  driver:
    cores: 1
    memory: "512m"
    serviceAccount: spark-driver
    labels:
      version: "3.5.1"
  executor:
    cores: 1
    instances: 2
    memory: "512m"
    labels:
      version: "3.5.1"
